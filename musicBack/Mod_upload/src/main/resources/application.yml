server:
  port: 8007

spring:
  application:
    name: mod-upload
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
        username: nacos
        password: nacos
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

upload:
  image:
    path: D:/Project/Music/uploads/images/
    allowed-types: jpg,jpeg,png,gif,webp
    max-size: 5242880
  lrc:
    path: D:/Project/Music/uploads/lrc/
    allowed-types: lrc
    max-size: 1048576
  music:
    path: D:/Project/Music/uploads/music/
    allowed-types: mp3,wav,flac,m4a,aac,ogg,wma
    max-size: 52428800

logging:
  level:
    com.itheima.upload: debug