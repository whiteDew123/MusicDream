# ============================================================
# 环境变量配置说明
#   不设置环境变量则使用默认值（冒号后面的值），无需额外配置即可启动
#   需要自定义请设置环境变量，例如 NACOS_PASSWORD=xxx
# ============================================================

server:
  port: 8012

spring:
  application:
    name: mod-upload
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
        username: nacos
        password: ${NACOS_PASSWORD:8ECJshugKVQP}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

audio:
  ffprobe-path: ${FFPROBE_PATH}

upload:
  image:
    path: ../resource/image/
    allowed-types: image/jpeg,image/png,image/gif,image/webp
    max-size: 5242880
  lrc:
    path: ../resource/lrc/
    allowed-types: text/plain,application/octet-stream
    max-size: 1048576
  music:
    path: ../resource/music/
    allowed-types: audio/mpeg,audio/mp3,audio/wav,audio/flac,audio/mp4,audio/x-m4a
    max-size: 52428800

logging:
  level:
    com.itheima.upload: debug