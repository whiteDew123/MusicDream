server:
  port: 8001

spring:
  application:
    name: mod-login
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
        username: nacos
        password: ${NACOS_PASSWORD:nacos}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/musicdreamer?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: '123456'
    type: com.alibaba.druid.pool.DruidDataSource
  data:
    redis:
      host: localhost
      port: 6379
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET:your-jwt-secret}
  expiration: 24

mail:
  host: smtp.qq.com
  port: 465
  username: ${MAIL_USERNAME:your-email@qq.com}
  password: ${MAIL_PASSWORD:your-smtp-auth-code}
  from-name: MusicDreamer
  code-expire-minutes: 5

logging:
  level:
    com.itheima.login: debug