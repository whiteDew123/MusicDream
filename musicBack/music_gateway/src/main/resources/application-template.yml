server:
  port: 9000

spring:
  application:
    name: music-gateway
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
        username: nacos
        password: ${NACOS_PASSWORD:nacos}
    gateway:
      routes:
        - id: mod-login
          uri: lb://mod-login
          predicates:
            - Path=/api/login/**,/api/register/**,/api/email/**
          filters:
            - StripPrefix=1

        - id: mod-admin
          uri: lb://mod-admin
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=1

        - id: mod-setting
          uri: lb://mod-setting
          predicates:
            - Path=/api/setting/**
          filters:
            - StripPrefix=1

        - id: mod-msg
          uri: lb://mod-msg
          predicates:
            - Path=/api/msg/**
          filters:
            - StripPrefix=1

        - id: mod-like
          uri: lb://mod-like
          predicates:
            - Path=/api/like/**
          filters:
            - StripPrefix=1

        - id: mod-music
          uri: lb://mod-recommend
          predicates:
            - Path=/api/music/**
          filters:
            - StripPrefix=1

        - id: mod-singer
          uri: lb://mod-singer
          predicates:
            - Path=/api/singer/**
          filters:
            - StripPrefix=1

        - id: mod-songList
          uri: lb://mod-songList
          predicates:
            - Path=/api/songList/**
          filters:
            - StripPrefix=1

        - id: mod-upload
          uri: lb://mod-upload
          predicates:
            - Path=/api/upload/**
          filters:
            - StripPrefix=1

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      discovery:
        locator:
          enabled: false

jwt:
  secret: ${JWT_SECRET:your-jwt-secret}
  expiration: 24