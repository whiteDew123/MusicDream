# ============================================================
#  共享配置文件 - 已提交 Git，请勿直接修改密码
#  需要自定义请设置环境变量，例如 NACOS_PASSWORD=xxx
#  默认值与本机开发环境一致，直接启动即可
# ============================================================
server:
  port: 8002

spring:
  application:
    name: mod-singer
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
        username: nacos
        password: ${NACOS_PASSWORD:8ECJshugKVQP}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:musicdreamer}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    type: com.alibaba.druid.pool.DruidDataSource
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

recognize:
  service-url: http://localhost:8011

logging:
  level:
    com.itheima.singer: debug